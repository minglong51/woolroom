language: en
body:
  low:
    grumpy:
      - "*turns its snout into a folded foreleg and stays there*"
    neutral:
      - "*settles its chin on the rug, ears loose*"
    content:
      - "*lets out a deep sigh and goes soft through the shoulders*"
  med:
    grumpy:
      - "*plants all four feet and studies the far wall*"
    neutral:
      - "*tests the air with its snout, patient and alert*"
    content:
      - "*leans close enough for one warm shoulder to touch*"
  high:
    grumpy:
      - "*stamps once, then holds very still*"
    neutral:
      - "*moves briskly around the rug, nose mapping every edge*"
    content:
      - "*bounces forward in two short hops, ears bright*"
action:
  call:
    low:
      grumpy:
        - "*one ear swivels toward the call; the rest does not move*"
      neutral:
        - "*lifts its snout from the rug and listens*"
      content:
        - "*answers with a soft breath and ambles closer*"
    med:
      grumpy:
        - "*looks over, waits a beat, then comes on its own terms*"
      neutral:
        - "*turns neatly and crosses the room at an even pace*"
      content:
        - "*comes over with a small side-to-side sway*"
    high:
      grumpy:
        - "*wheels around quickly, then slows before arriving*"
      neutral:
        - "*trots across the rug, ears aimed forward*"
      content:
        - "*hurries in and stops with its snout beside your hand*"
  feed:
    low:
      grumpy:
        - "*inspects the bowl from two angles before beginning*"
      neutral:
        - "*eats slowly, pausing once to breathe between bites*"
      content:
        - "*settles beside the bowl and eats with quiet focus*"
    med:
      grumpy:
        - "*nudges the bowl into place, then gets to work*"
      neutral:
        - "*works around the rim in a steady circle*"
      content:
        - "*finishes the bowl and checks the nearby floor carefully*"
    high:
      grumpy:
        - "*arrives fast, brakes hard, and examines the offering*"
      neutral:
        - "*is at the bowl before the last piece settles*"
      content:
        - "*eats with bright concentration, ears keeping time*"
  greet:
    low:
      grumpy:
        - "*keeps its chin down but points one ear your way*"
      neutral:
        - "*raises its head and takes one thoughtful sniff*"
      content:
        - "*shifts over to leave a warm place beside it*"
    med:
      grumpy:
        - "*stands squarely, deciding whether the room has improved*"
      neutral:
        - "*walks halfway over and waits for you to finish arriving*"
      content:
        - "*meets you at the rug and presses its snout to your knee*"
    high:
      grumpy:
        - "*circles once, then offers a brisk nod of the snout*"
      neutral:
        - "*trots up, checks the air around you, and settles*"
      content:
        - "*hops forward and wiggles from shoulders to tail*"
  message:
    low:
      grumpy:
        - "*hears the chime and buries its snout a little deeper*"
      neutral:
        - "*opens one eye toward the screen glow, then rests again*"
      content:
        - "*dozes beside your hand while the message arrives*"
    med:
      grumpy:
        - "*looks from the screen to you and exhales through its nose*"
      neutral:
        - "*tips its head at the chime and listens to the quiet after*"
      content:
        - "*settles against your side while you read*"
    high:
      grumpy:
        - "*paces past the glowing screen and pointedly keeps going*"
      neutral:
        - "*arrives at the chime with its snout already searching*"
      content:
        - "*leans into the space beside the screen, ready to keep company*"
  pet:
    low:
      grumpy:
        - "*holds still under the hand, ears set sideways*"
      neutral:
        - "*accepts the stroke with a slow breath through the snout*"
      content:
        - "*sinks heavier into the rug beneath your palm*"
    med:
      grumpy:
        - "*steps aside once, then returns a shoulder to the hand*"
      neutral:
        - "*leans into each pass by a careful inch*"
      content:
        - "*angles its whole side toward the next stroke*"
    high:
      grumpy:
        - "*ducks the first touch and chooses the second*"
      neutral:
        - "*walks a small circle beneath the moving hand*"
      content:
        - "*wiggles so thoroughly that the petting has to follow*"
  play:
    low:
      grumpy:
        - "*rests one hoof on the toy and declines to elaborate*"
      neutral:
        - "*nudges the toy once with its snout and watches it roll*"
      content:
        - "*keeps the toy tucked close between its forelegs*"
    med:
      grumpy:
        - "*pushes the toy out of reach, then goes after it anyway*"
      neutral:
        - "*rolls the toy along the rug in a patient line*"
      content:
        - "*carries the toy a short distance and sets it at your feet*"
    high:
      grumpy:
        - "*charges past the toy, turns sharply, and claims the reroute*"
      neutral:
        - "*chases the toy in quick loops around the rug*"
      content:
        - "*bounds after it, stops, and bounds back for another round*"
  walk:
    low:
      grumpy:
        - "*examines the threshold at length before crossing it*"
      neutral:
        - "*gets up carefully and follows at a measured pace*"
      content:
        - "*ambles out, nose low and shoulders loose*"
    med:
      grumpy:
        - "*pauses at the doorway until the route smells acceptable*"
      neutral:
        - "*sets off steadily, checking each new patch of air*"
      content:
        - "*walks beside you with an easy, rolling stride*"
    high:
      grumpy:
        - "*rushes to the door, then insists on one last inspection*"
      neutral:
        - "*trots through the doorway with its snout leading*"
      content:
        - "*bounces across the threshold and waits just beyond it*"
spot:
  belly:
    low:
      grumpy:
        - "*draws its legs in and keeps the belly covered*"
      neutral:
        - "*rolls just far enough for one warm patch of belly to show*"
      content:
        - "*settles onto its side, belly loose beneath your hand*"
    med:
      grumpy:
        - "*allows one pass, then gathers its feet underneath*"
      neutral:
        - "*holds the sideways pose and watches your hand*"
      content:
        - "*stretches out with its legs adrift and stays there*"
    high:
      grumpy:
        - "*twists upright before the second pass arrives*"
      neutral:
        - "*drops onto one side, then pops up to reconsider*"
      content:
        - "*flops over with a soft thump and a full-body wiggle*"
  body:
    low:
      grumpy:
        - "*shifts its ribs just beyond the center of the stroke*"
      neutral:
        - "*breathes evenly beneath the long pass*"
      content:
        - "*leans its warm side into the length of your hand*"
    med:
      grumpy:
        - "*steps once to reset the distance, then stands still*"
      neutral:
        - "*keeps all four feet planted while the hand travels*"
      content:
        - "*curves gently toward each returning stroke*"
    high:
      grumpy:
        - "*moves out from under the hand and back beside it*"
      neutral:
        - "*turns in place to keep one side within reach*"
      content:
        - "*presses shoulder, ribs, and rump into one sweeping pass*"
  ear:
    low:
      grumpy:
        - "*folds the ear close and waits for the hand to move on*"
      neutral:
        - "*lets the ear rest softly between your fingers*"
      content:
        - "*tilts until the ear rub reaches exactly the right place*"
    med:
      grumpy:
        - "*flicks the ear free, then offers it again a moment later*"
      neutral:
        - "*tracks your fingers with one small turn of the ear*"
      content:
        - "*leans down as the ear goes loose under the rub*"
    high:
      grumpy:
        - "*shakes once and resets both ears at attention*"
      neutral:
        - "*keeps the other ear busy listening around the room*"
      content:
        - "*tips sideways into the rub until one hoof lifts*"
  head:
    low:
      grumpy:
        - "*lowers its brow and keeps the snout pointed away*"
      neutral:
        - "*rests the weight of its head beneath your palm*"
      content:
        - "*pushes its forehead forward by one trusting inch*"
    med:
      grumpy:
        - "*holds the head steady, ears giving the only reply*"
      neutral:
        - "*follows the hand with a slow turn of the snout*"
      content:
        - "*leans its broad forehead into your fingers*"
    high:
      grumpy:
        - "*ducks aside and comes back when the hand slows down*"
      neutral:
        - "*lifts its chin, checks the air, and returns to the touch*"
      content:
        - "*bumps upward into your palm and wiggles in place*"
  tail:
    low:
      grumpy:
        - "*tucks the small curl close against its side*"
      neutral:
        - "*the tail loosens by a fraction under your fingers*"
      content:
        - "*the curl gives one slow, contented sway*"
    med:
      grumpy:
        - "*moves the tail neatly out of reach, then lets it return*"
      neutral:
        - "*holds still while the little curl is traced*"
      content:
        - "*the tail uncurls halfway and springs softly back*"
    high:
      grumpy:
        - "*whips around to inspect the hand behind it*"
      neutral:
        - "*the curl bobs while the rest of the pig stays alert*"
      content:
        - "*the tail bounces fast enough to move the whole rump*"
tiny:
  grumpy:
    - "hnf."
  neutral:
    - "hmm?"
  content:
    - "mmh."
