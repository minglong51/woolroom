<g>
  <!-- Minimal but rig-complete: the wool rig class contract (figures.js)
       needs all five eye-state subgroups — in the happy/side-eye/sleep poses
       style.css hides .eyes-open, so a missing subgroup renders the figure
       eyeless. The pebble keeps the contract with two-stroke arcs. -->
  <ellipse class="dog-contact" cx="200" cy="452" rx="40" ry="7" fill="rgba(90,72,54,.28)"/>
  <g class="tailg"><circle cx="240" cy="430" r="5" fill="#77776f" class="point"/></g>
  <ellipse cx="200" cy="425" rx="42" ry="28" fill="#9a9a94" class="coat dog-body"/>
  <ellipse cx="192" cy="432" rx="22" ry="12" fill="#cfcfc8" class="cream dog-chest"/>
  <g class="headg">
    <g class="earg"></g>
    <g id="dog-eyes">
      <g class="eyes-open">
        <circle cx="190" cy="420" r="2.5" fill="#3a3a34"/>
        <circle cx="210" cy="420" r="2.5" fill="#3a3a34"/>
      </g>
      <g class="eyes-happy">
        <path d="M186 420 q4 3 8 0 M206 420 q4 3 8 0" stroke="#3a3a34" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
      <g class="eyes-side">
        <circle cx="186" cy="420" r="2.5" fill="#3a3a34"/>
        <circle cx="206" cy="420" r="2.5" fill="#3a3a34"/>
      </g>
      <g class="nap-eyes">
        <path d="M186 421 q4 2.5 8 0 M206 421 q4 2.5 8 0" stroke="#3a3a34" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
      <g class="one-eye-eyes">
        <path d="M186 421 q4 2.5 8 0" stroke="#3a3a34" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="210" cy="420" r="2.2" fill="#3a3a34"/>
      </g>
    </g>
  </g>
  <title>a smooth gray pebble, sitting</title>
</g>
