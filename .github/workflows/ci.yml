name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Tests (hermetic — no services, keys, or network)
        run: uv run pytest tests -q
      - name: Woolroom distribution and contract parity smoke
        shell: bash
        run: |
          set -euo pipefail

          smoke_root="$(mktemp -d)"
          uv build --package woolpack --no-sources --clear --no-create-gitignore --out-dir "$smoke_root/pack-dist"
          uv build --package woolroom --no-sources --clear --no-create-gitignore --out-dir "$smoke_root/core-dist"
          uvx --from 'twine==7.0.0' twine check --strict "$smoke_root"/*-dist/*

          core_wheel="$(find "$smoke_root/core-dist" -maxdepth 1 -name 'woolroom-*.whl' -print -quit)"
          core_sdist="$(find "$smoke_root/core-dist" -maxdepth 1 -name 'woolroom-*.tar.gz' -print -quit)"
          pack_wheel="$(find "$smoke_root/pack-dist" -maxdepth 1 -name 'woolpack-*.whl' -print -quit)"
          test -n "$core_wheel"
          test -n "$core_sdist"
          test -n "$pack_wheel"

          CORE_WHEEL="$core_wheel" PACK_WHEEL="$pack_wheel" uv run python - <<'PY'
          import os
          import tomllib
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          root = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          pack = tomllib.loads(Path("packages/woolpack/pyproject.toml").read_text(encoding="utf-8"))
          core_version = root["project"]["version"]
          pack_version = pack["project"]["version"]
          if core_version != pack_version:
              raise SystemExit("woolroom and woolpack versions must move together")
          if f"woolpack=={pack_version}" not in root["project"]["dependencies"]:
              raise SystemExit("woolroom must pin the workspace woolpack version exactly")

          with ZipFile(os.environ["CORE_WHEEL"]) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
              required = {
                  "woolroom/__init__.py",
                  "woolroom/adoption.py",
                  "woolroom/auth.py",
                  "woolroom/overlay.py",
                  "woolroom/py.typed",
                  "woolroom/migrations/env.py",
                  "woolroom/migrations/script.py.mako",
                  "woolroom/migrations/versions/48575234f9ca_initial_schema.py",
                  "app/static/index.html",
                  "app/static/app.js",
                  "app/static/style.css",
                  "app/static/js/figures.js",
                  "app/packs/profiles/dog/pack.yaml",
                  "app/packs/profiles/dog/voice.yaml",
                  "app/packs/profiles/dog/phrases/dog.yaml",
                  "app/packs/profiles/dog/species/dog.svg",
                  "app/packs/profiles/dog/species/dog.yaml",
                  "app/packs/profiles/pig/pack.yaml",
                  "app/packs/profiles/pig/voice.yaml",
                  "app/packs/profiles/pig/phrases/pig.yaml",
                  "app/packs/profiles/pig/species/pig.svg",
                  "app/packs/profiles/pig/species/pig.yaml",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"woolroom wheel is missing runtime files: {missing}")
              if metadata.get("Version") != core_version:
                  raise SystemExit("woolroom wheel version has drifted from pyproject.toml")
              if f"woolpack=={pack_version}" not in metadata.get_all("Requires-Dist", []):
                  raise SystemExit("woolroom wheel lost its exact woolpack compatibility pin")
              if metadata.get("License-Expression") != "MIT AND CC0-1.0":
                  raise SystemExit("woolroom wheel SPDX license metadata has drifted")
              license_files = {
                  name.rsplit("/", 1)[-1]
                  for name in names
                  if ".dist-info/licenses/" in name
              }
              if license_files != {"LICENSE", "LICENSE-CC0"}:
                  raise SystemExit("woolroom wheel license texts have drifted")

          with ZipFile(os.environ["PACK_WHEEL"]) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
              if "woolpack/cards.py" not in names:
                  raise SystemExit("woolpack wheel is missing the pet-card contract")
              if "woolpack/py.typed" not in names:
                  raise SystemExit("woolpack wheel is missing its typing marker")
              if metadata.get("Version") != pack_version:
                  raise SystemExit("woolpack wheel version has drifted from pyproject.toml")
          PY

          for core_artifact in "$core_wheel" "$core_sdist"; do
            install_root="$(mktemp -d)"
            uv venv "$install_root/venv"
            uv pip install --python "$install_root/venv/bin/python" "$pack_wheel" "$core_artifact"
            (
              cd "$install_root"
              DATABASE_URL="sqlite+aiosqlite:///$install_root/distribution.db" \
                SECRET_KEY="distribution-smoke-secret" \
                ENV=dev \
                "$install_root/venv/bin/python" - <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          from alembic import command
          from alembic.config import Config
          from fastapi.testclient import TestClient
          from importlib.metadata import version

          import woolroom
          from woolpack import PET_CARD_SCHEMA_VERSION
          from woolroom import AdoptionDefaults, AuthNamespace

          assert Path(woolroom.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert woolroom.__version__ == version("woolroom")
          assert woolroom.PLUGIN_API_VERSION == 1
          assert PET_CARD_SCHEMA_VERSION == 1
          assert woolroom.create_app().state.catalog_overlay_provider is not None
          namespace = AuthNamespace(
              session_cookie="distribution_session",
              session_salt="distribution-session",
              site_access_cookie="distribution_site",
              site_access_salt="distribution-site",
              guest_access_cookie="distribution_guest",
              guest_access_salt="distribution-guest",
              pending_invite_cookie="distribution_pending",
          )
          assert woolroom.create_app(auth_namespace=namespace).state.auth_namespace is namespace
          migration_dir = woolroom.migration_path()
          assert (migration_dir / "env.py").is_file()
          config = Config()
          config.set_main_option("script_location", str(migration_dir))
          command.upgrade(config, "head")
          db_path = Path(__import__("os").environ["DATABASE_URL"].removeprefix("sqlite+aiosqlite:///"))
          with sqlite3.connect(db_path) as connection:
              assert connection.execute("SELECT version_num FROM alembic_version").fetchone()
          app = woolroom.create_app(
              adoption_defaults=AdoptionDefaults(
                  primary_species="dog",
                  primary_coat="red",
                  secondary_species="pig",
                  secondary_coat="pink",
              )
          )
          for _ in range(2):
              with TestClient(app) as client:
                  assert set(client.get("/api/packs").json()) == {"dog", "pig"}
          PY
            )
          done
      - name: Woolpack standalone boundary and distribution smoke
        shell: bash
        run: |
          set -euo pipefail

          cmp LICENSE packages/woolpack/LICENSE
          cmp app/static/style.css packages/woolpack/src/woolpack/resources/style.css
          diff -ru packs/pebble packages/woolpack/src/woolpack/resources/pebble

          uv run python - <<'PY'
          import ast
          from pathlib import Path

          from app.packs.loader import pack_environment
          from woolpack import DEFAULT_ENVIRONMENT

          failures = []
          for path in Path("packages/woolpack/src/woolpack").rglob("*.py"):
              for node in ast.walk(ast.parse(path.read_text(encoding="utf-8"), filename=str(path))):
                  if isinstance(node, ast.Import):
                      failures.extend(
                          f"{path}:{node.lineno}: import {alias.name}"
                          for alias in node.names
                          if alias.name == "app" or alias.name.startswith("app.")
                      )
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      if node.module == "app" or node.module.startswith("app."):
                          failures.append(f"{path}:{node.lineno}: from {node.module} import ...")

          if failures:
              raise SystemExit("woolpack must not import the application:\n" + "\n".join(failures))
          if pack_environment() != DEFAULT_ENVIRONMENT:
              raise SystemExit("woolpack DEFAULT_ENVIRONMENT has drifted from woolroom")
          PY

          smoke_root="$(mktemp -d)"
          uv build --package woolpack --no-sources --clear --no-create-gitignore --out-dir "$smoke_root/dist"
          uvx --from 'twine==7.0.0' twine check --strict "$smoke_root"/dist/*
          wheel="$(find "$smoke_root/dist" -maxdepth 1 -name 'woolpack-*.whl' -print -quit)"
          sdist="$(find "$smoke_root/dist" -maxdepth 1 -name 'woolpack-*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"
          WOOLPACK_WHEEL="$wheel" uv run python - <<'PY'
          import os
          from email.parser import BytesParser
          from zipfile import ZipFile

          with ZipFile(os.environ["WOOLPACK_WHEEL"]) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_name))
              required = {
                  "woolpack/resources/style.css",
                  "woolpack/resources/pebble/pack.yaml",
                  "woolpack/resources/pebble/voice.yaml",
                  "woolpack/resources/pebble/phrases/pebble.yaml",
                  "woolpack/resources/pebble/quirks/sunbather.yaml",
                  "woolpack/resources/pebble/species/pebble.svg",
                  "woolpack/resources/pebble/species/pebble.yaml",
              }
              missing = sorted(required - set(names))
              if missing:
                  raise SystemExit(f"wheel is missing resources: {missing}")
              if metadata.get_all("Requires-Dist", []) != ["PyYAML>=6.0"]:
                  raise SystemExit("wheel dependency metadata has drifted")
              if metadata.get("License-Expression") != "MIT AND CC0-1.0":
                  raise SystemExit("wheel SPDX license metadata has drifted")
              license_files = {
                  name.rsplit("/", 1)[-1]
                  for name in names
                  if ".dist-info/licenses/" in name
              }
              if license_files != {"LICENSE", "LICENSE-CC0"}:
                  raise SystemExit("wheel license texts have drifted")
          PY
          for artifact in "$wheel" "$sdist"; do
            install_root="$(mktemp -d)"
            uv venv "$install_root/venv"
            uv pip install --python "$install_root/venv/bin/python" "$artifact"
            woolpack="$install_root/venv/bin/woolpack"
            "$woolpack" --version
            "$woolpack" new ci_pet --dest "$install_root/ci_pet" --author ci --license MIT
            "$woolpack" render "$install_root/ci_pet" -o "$install_root/ci-pet.html"
            test -s "$install_root/ci-pet.html"
            "$woolpack" lint "$install_root/ci_pet" --strict
          done
      # The shipped example is the gold standard: it clears the same
      # --strict bar the submission flow asks of external packs.
      - name: Example pack lints (strict)
        run: uv run python scripts/pack_lint.py packs/pebble --strict
      - name: Publish-gate denylist
        run: uv run python scripts/denylist_check.py
      - name: Ruff
        run: uv run ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Docker build and core-profile smoke
        run: |
          docker build --build-arg GIT_SHA=ci -t woolroom-ci .
          docker run --rm woolroom-ci python -c 'from app.packs import load_core_profiles; assert [record.name for record in load_core_profiles()] == ["dog", "pig"]'
