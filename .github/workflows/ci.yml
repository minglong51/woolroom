name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Tests (hermetic — no services, keys, or network)
        run: uv run pytest tests -q
      - name: Ruff
        run: uv run ruff check .
      # The shipped example pack carries one deliberate rig-extras WARN
      # (pinned by tests/test_pack_lint.py), so CI runs the ERROR gate.
      # --strict is registry-CI mode for external packs (docs/packs.md).
      - name: Example pack lints
        run: uv run python scripts/pack_lint.py packs/pebble
      - name: Publish-gate denylist
        run: uv run python scripts/denylist_check.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker build smoke (build only)
        run: docker build --build-arg GIT_SHA=ci -t woolroom-ci .
