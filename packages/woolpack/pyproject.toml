[project]
name = "woolpack"
version = "0.3.1"
description = "Standalone validation and authoring tools for Woolroom content packs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC0-1.0"
license-files = ["LICENSE", "LICENSE-CC0"]
keywords = ["cli", "content-packs", "woolroom", "yaml"]
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://www.minglongpan.com/projects/woolroom"
Documentation = "https://github.com/minglong51/woolroom/blob/main/docs/packs.md"
Issues = "https://github.com/minglong51/woolroom/issues"
Repository = "https://github.com/minglong51/woolroom"
"Pack index" = "https://github.com/minglong51/woolroom-packs"

[project.scripts]
woolpack = "woolpack.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"woolpack" = ["py.typed"]
"woolpack.resources" = [
    "style.css",
    "pebble/*.yaml",
    "pebble/phrases/*.yaml",
    "pebble/quirks/*.yaml",
    "pebble/species/*.svg",
    "pebble/species/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
