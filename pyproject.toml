[project]
name = "woolroom"
version = "0.3.0"
description = "A shared ambient pet — one quiet animal in a small room, kept by two people."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC0-1.0"
license-files = ["LICENSE", "packages/woolpack/LICENSE-CC0"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "apscheduler>=3.10",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "woolpack==0.3.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
woolroom-db = "woolroom.database:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "woolroom*"]

[tool.setuptools.package-data]
app = ["static/*", "static/**/*"]
"app.packs" = [
    "profiles/*/*.yaml",
    "profiles/*/phrases/*.yaml",
    "profiles/*/species/*.svg",
    "profiles/*/species/*.yaml",
]
woolroom = ["py.typed", "migrations/README", "migrations/script.py.mako"]

[tool.uv.workspace]
members = ["packages/woolpack"]

[tool.uv.sources]
woolpack = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
